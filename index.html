<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Narrow Path — loading</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1c1438;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  #glcanvas {
    display: block;
    width: 100vw;
    height: 100vh;
    outline: none;
    border: 0;
    background: #1c1438;
    touch-action: none;
    overscroll-behavior: none;
  }
  #rotate-hint {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.88);
    color: #e8c46a;
    font: 20px Georgia, serif;
    letter-spacing: 0.04em;
    text-align: center;
    pointer-events: none;
  }
  @media (orientation: portrait) {
    #rotate-hint { display: flex; }
  }
  /* Shown until the wasm module starts drawing. */
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    flex-direction: column;
    gap: 22px;
    background: #1c1438;
    color: #e8c46a;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px;
    letter-spacing: 0.04em;
    pointer-events: none;
    transition: opacity 0.4s ease-out;
  }
  #loading.gone {
    opacity: 0;
  }
  #loading img {
    display: block;
    width: auto;
    max-width: 60vw;
    max-height: 45vh;
    image-rendering: pixelated;
  }
  #loading-bar {
    width: min(360px, 60vw);
    height: 5px;
    overflow: hidden;
    background: rgba(232, 196, 106, 0.2);
  }
  #loading-bar::after {
    content: "";
    display: block;
    width: 35%;
    height: 100%;
    background: #e8c46a;
    animation: loading-progress 1.4s ease-in-out infinite;
  }
  @keyframes loading-progress {
    from { transform: translateX(-110%); }
    to { transform: translateX(310%); }
  }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<div id="loading"><img src="logo.png" alt="The Narrow Path"><div id="loading-bar" aria-hidden="true"></div><div>Loading…</div></div>
<div id="rotate-hint">Rotate your phone</div>

<script src="mq_js_bundle.js"></script>
<script>
  miniquad_add_plugin({
    register_plugin: function (importObject) {
      importObject.env.np_game_ready = function () {
        document.title = "The Narrow Path";
        window.__npReady = true;
      };

      // The game's own storage: the browser has no filesystem, so the run,
      // the profile and the settings live in the page's localStorage.
      function npMemory() {
        if (typeof wasm_memory !== "undefined" && wasm_memory) return wasm_memory;
        if (window.wasm_exports && window.wasm_exports.memory) return window.wasm_exports.memory;
        return null;
      }

      function npReadString(mem, ptr, len) {
        if (!mem || len <= 0) return "";
        return new TextDecoder("utf-8").decode(new Uint8Array(mem.buffer, ptr, len));
      }

      function npKey(key) {
        return "narrowpath:" + key;
      }

      importObject.env.np_storage_set = function (keyPtr, keyLen, valPtr, valLen) {
        try {
          var mem = npMemory();
          if (!mem) return;
          var key = npReadString(mem, keyPtr, keyLen);
          var val = npReadString(mem, valPtr, valLen);
          window.localStorage.setItem(npKey(key), val);
        } catch (e) {
          console.error("np_storage_set failed", e);
        }
      };

      importObject.env.np_storage_get_len = function (keyPtr, keyLen) {
        try {
          var mem = npMemory();
          if (!mem) return -1;
          var key = npReadString(mem, keyPtr, keyLen);
          var val = window.localStorage.getItem(npKey(key));
          if (val === null) return -1;
          return new TextEncoder().encode(val).length;
        } catch (e) {
          console.error("np_storage_get_len failed", e);
          return -1;
        }
      };

      importObject.env.np_storage_get = function (keyPtr, keyLen, outPtr, outLen) {
        try {
          var mem = npMemory();
          if (!mem) return 0;
          var key = npReadString(mem, keyPtr, keyLen);
          var val = window.localStorage.getItem(npKey(key));
          if (val === null) return 0;
          var bytes = new TextEncoder().encode(val);
          var n = Math.min(bytes.length, outLen);
          new Uint8Array(mem.buffer, outPtr, n).set(bytes.subarray(0, n));
          return n;
        } catch (e) {
          console.error("np_storage_get failed", e);
          return 0;
        }
      };

      importObject.env.np_storage_remove = function (keyPtr, keyLen) {
        try {
          var mem = npMemory();
          if (!mem) return;
          var key = npReadString(mem, keyPtr, keyLen);
          window.localStorage.removeItem(npKey(key));
        } catch (e) {
          console.error("np_storage_remove failed", e);
        }
      };
    },
    name: "np_ready",
    version: 1
  });

  (function () {
    const loading = document.getElementById('loading');
    const view = document.getElementById('glcanvas');
    const started = performance.now();
    let wasmStartedAt = null;
    let hidden = false;
    function hide() {
      if (hidden) return;
      hidden = true;
      loading.classList.add('gone');
      view.focus();
      setTimeout(() => loading.remove(), 450);
    }
    function poll() {
      if (window.wasm_exports && wasmStartedAt === null) wasmStartedAt = performance.now();
      const now = performance.now();
      if (now - started >= 25000) hide();
      else if (window.__npReady === true) hide();
      else if (wasmStartedAt !== null && now - wasmStartedAt >= 6000) hide();
      else setTimeout(poll, 250);
    }
    load("narrow_path.wasm");
    poll();
  })();
</script>
</body>
</html>
