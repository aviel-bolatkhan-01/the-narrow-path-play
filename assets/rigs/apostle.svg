<filter id="np_paint" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
  <feOffset in="SourceAlpha" dx="-18" dy="-20" result="offDR"/>
  <feComposite in="SourceAlpha" in2="offDR" operator="out" result="bandDR"/>
  <feGaussianBlur in="bandDR" stdDeviation="8" result="bandDRb"/>
  <feComposite in="bandDRb" in2="SourceAlpha" operator="in" result="shadeMask"/>
  <feFlood flood-color="#2a1030" flood-opacity="0.5" result="shadeCol"/>
