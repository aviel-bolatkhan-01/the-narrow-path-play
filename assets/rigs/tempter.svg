  <feOffset in="SourceAlpha" dx="7" dy="9" result="offUL"/>
  <feComposite in="SourceAlpha" in2="offUL" operator="out" result="bandUL"/>
  <feGaussianBlur in="bandUL" stdDeviation="3" result="bandULb"/>
  <feComposite in="bandULb" in2="SourceAlpha" operator="in" result="rimMask"/>
  <feFlood flood-color="#fff1cf" flood-opacity="0.55" result="rimCol"/>
  <feComposite in="rimCol" in2="rimMask" operator="in" result="rim"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="soft"/>
