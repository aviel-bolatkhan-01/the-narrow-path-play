<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900">
  <defs>
<filter id="np_paint" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
  <feOffset in="SourceAlpha" dx="-18" dy="-20" result="offDR"/>
  <feComposite in="SourceAlpha" in2="offDR" operator="out" result="bandDR"/>
  <feGaussianBlur in="bandDR" stdDeviation="8" result="bandDRb"/>
  <feComposite in="bandDRb" in2="SourceAlpha" operator="in" result="shadeMask"/>
  <feFlood flood-color="#2a1030" flood-opacity="0.5" result="shadeCol"/>
  <feComposite in="shadeCol" in2="shadeMask" operator="in" result="shade"/>
  <feOffset in="SourceAlpha" dx="7" dy="9" result="offUL"/>
  <feComposite in="SourceAlpha" in2="offUL" operator="out" result="bandUL"/>
  <feGaussianBlur in="bandUL" stdDeviation="3" result="bandULb"/>
  <feComposite in="bandULb" in2="SourceAlpha" operator="in" result="rimMask"/>
  <feFlood flood-color="#fff1cf" flood-opacity="0.55" result="rimCol"/>
  <feComposite in="rimCol" in2="rimMask" operator="in" result="rim"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="soft"/>
  <feSpecularLighting in="soft" surfaceScale="5" specularConstant="0.75" specularExponent="22" lighting-color="#fff6e0" result="spec">
    <fePointLight x="-400" y="-600" z="520"/>
