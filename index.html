<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Narrow Path</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #glcanvas {
    display: block;
    width: 100vw;
    height: 100vh;
    outline: none;
    border: 0;
  }
  /* Shown until the wasm module starts drawing. */
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #e8c46a;
    font-family: "Cinzel Decorative", "Cinzel", "EB Garamond", Georgia, "Times New Roman", serif;
    font-size: 30px;
    letter-spacing: 0.08em;
    text-shadow: 0 0 18px rgba(232, 196, 106, 0.35);
    pointer-events: none;
    transition: opacity 0.4s ease-out;
  }
  #loading.gone {
    opacity: 0;
  }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<div id="loading">Loading…</div>

<script src="mq_js_bundle.js"></script>
<script>
  // The loader sets the global `wasm_exports` once the module is running, so
  // poll for it and reveal the canvas then (the game paints its title screen
  // instantly). Everything lives in a closure: mq_js_bundle.js declares its own
  // globals — including `canvas` — at the top level.
  (function () {
    const loading = document.getElementById('loading');
    const view = document.getElementById('glcanvas');

    function watch() {
      if (window.wasm_exports) {
        loading.classList.add('gone');
        view.focus();
        setTimeout(() => loading.remove(), 600);
        return;
      }
      requestAnimationFrame(watch);
    }

    load("narrow_path.wasm");
    requestAnimationFrame(watch);
  })();
</script>
</body>
</html>
