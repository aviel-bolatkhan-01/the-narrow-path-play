  <feGaussianBlur in="bandDR" stdDeviation="8" result="bandDRb"/>
  <feComposite in="bandDRb" in2="SourceAlpha" operator="in" result="shadeMask"/>
  <feFlood flood-color="#2a1030" flood-opacity="0.5" result="shadeCol"/>
