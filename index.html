<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Narrow Path — loading</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1c1438;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  #glcanvas {
    display: block;
    width: 100vw;
    height: 100vh;
    outline: none;
    border: 0;
    background: #1c1438;
    touch-action: none;
    overscroll-behavior: none;
  }
  #rotate-hint {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.88);
    color: #e8c46a;
    font: 20px Georgia, serif;
    letter-spacing: 0.04em;
    text-align: center;
    pointer-events: none;
  }
  @media (orientation: portrait) {
    #rotate-hint { display: flex; }
  }
  /* Shown until the wasm module starts drawing. */
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    flex-direction: column;
    gap: 22px;
    background: #1c1438;
    color: #e8c46a;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px;
    letter-spacing: 0.04em;
    pointer-events: none;
    transition: opacity 0.4s ease-out;
  }
  #loading.gone {
    opacity: 0;
  }
  #loading img {
    display: block;
    width: auto;
    max-width: 60vw;
    max-height: 45vh;
    image-rendering: pixelated;
  }
  #loading-bar {
    width: min(360px, 60vw);
    height: 5px;
    overflow: hidden;
    background: rgba(232, 196, 106, 0.2);
  }
  #loading-bar::after {
    content: "";
    display: block;
    width: 35%;
    height: 100%;
    background: #e8c46a;
    animation: loading-progress 1.4s ease-in-out infinite;
  }
  @keyframes loading-progress {
    from { transform: translateX(-110%); }
    to { transform: translateX(310%); }
  }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1"></canvas>
<div id="loading"><img src="logo.png" alt="The Narrow Path"><div id="loading-bar" aria-hidden="true"></div><div>Loading…</div></div>
<div id="rotate-hint">Rotate your phone</div>

<script src="mq_js_bundle.js"></script>
<script>
  (function () {
    const loading = document.getElementById('loading');
    const view = document.getElementById('glcanvas');
    const started = performance.now();
    let wasmStartedAt = null;
    let hidden = false;
    function hide() {
      if (hidden) return;
      hidden = true;
      loading.classList.add('gone');
      view.focus();
      setTimeout(() => loading.remove(), 450);
    }
    function poll() {
      if (window.wasm_exports && wasmStartedAt === null) wasmStartedAt = performance.now();
      const now = performance.now();
      if (now - started >= 25000) hide();
      else if (document.title === 'The Narrow Path' && wasmStartedAt !== null && now - wasmStartedAt >= 1500) hide();
      else setTimeout(poll, 250);
    }
    load("narrow_path.wasm");
    poll();
  })();
</script>
</body>
</html>
